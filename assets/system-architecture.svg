<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">飞跃雷区空地协同系统架构</title>
  <desc id="desc">四旋翼无人机通过视觉、飞控和通信控制车模执行</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfc"/><stop offset="1" stop-color="#eef6f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#102a43" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#0b7285"/></marker>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)" stroke="#d0d7de"/>
  <text x="600" y="42" text-anchor="middle" fill="#102a43" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25" font-weight="700">飞跃雷区：四旋翼无人机 × 车模空地协同</text>
  <text x="600" y="70" text-anchor="middle" fill="#52606d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">视觉感知 → 飞控融合与规划 → 通信执行</text>
  <g filter="url(#shadow)">
    <rect x="58" y="112" width="245" height="232" rx="14" fill="#ffffff"/>
    <rect x="348" y="112" width="245" height="232" rx="14" fill="#ffffff"/>
    <rect x="638" y="112" width="245" height="232" rx="14" fill="#ffffff"/>
    <rect x="928" y="112" width="214" height="232" rx="14" fill="#ffffff"/>
  </g>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <circle cx="180" cy="161" r="29" fill="#d9f0f0"/><text x="180" y="170" text-anchor="middle" fill="#0b5964" font-size="26">✦</text>
    <text x="180" y="213" text-anchor="middle" fill="#102a43" font-size="21" font-weight="700">视觉感知</text>
    <text x="180" y="246" text-anchor="middle" fill="#52606d" font-size="15">三摄图像板</text><text x="180" y="272" text-anchor="middle" fill="#52606d" font-size="15">信标 / 车灯识别</text><text x="180" y="298" text-anchor="middle" fill="#52606d" font-size="15">姿态与高度信息</text>
    <circle cx="470" cy="161" r="29" fill="#dbeafe"/><text x="470" y="170" text-anchor="middle" fill="#1e40af" font-size="24">⚙</text>
    <text x="470" y="213" text-anchor="middle" fill="#102a43" font-size="21" font-weight="700">无人机飞控</text>
    <text x="470" y="246" text-anchor="middle" fill="#52606d" font-size="15">相机模型与传感器融合</text><text x="470" y="272" text-anchor="middle" fill="#52606d" font-size="15">姿态 / 高度 / 速度控制</text><text x="470" y="298" text-anchor="middle" fill="#52606d" font-size="15">路径规划与状态机</text>
    <circle cx="760" cy="161" r="29" fill="#ede9fe"/><text x="760" y="170" text-anchor="middle" fill="#5b21b6" font-size="24">⇄</text>
    <text x="760" y="213" text-anchor="middle" fill="#102a43" font-size="21" font-weight="700">协同通信</text>
    <text x="760" y="246" text-anchor="middle" fill="#52606d" font-size="15">AirComm UART</text><text x="760" y="272" text-anchor="middle" fill="#52606d" font-size="15">飞控 → 车模指令</text><text x="760" y="298" text-anchor="middle" fill="#52606d" font-size="15">执行状态回传</text>
    <circle cx="1035" cy="161" r="29" fill="#dcfce7"/><text x="1035" y="170" text-anchor="middle" fill="#166534" font-size="24">●</text>
    <text x="1035" y="213" text-anchor="middle" fill="#102a43" font-size="21" font-weight="700">车模执行</text>
    <text x="1035" y="246" text-anchor="middle" fill="#52606d" font-size="15">麦轮控制</text><text x="1035" y="272" text-anchor="middle" fill="#52606d" font-size="15">编码器 / 里程计</text><text x="1035" y="298" text-anchor="middle" fill="#52606d" font-size="15">熄灭目标信标</text>
  </g>
  <g fill="none" stroke="#0b7285" stroke-width="3" marker-end="url(#arrow)"><path d="M304 228H340"/><path d="M594 228H630"/><path d="M884 228H920"/></g>
  <text x="600" y="390" text-anchor="middle" fill="#52606d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15">从图像识别到控制执行的完整空地协同链路</text>
</svg>
